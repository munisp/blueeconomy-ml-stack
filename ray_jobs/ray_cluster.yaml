# Local dev Ray cluster config (ray up ray_cluster.yaml).
# Single head node, CPU-only. For k8s use KubeRay — see deploy/README.md.
cluster_name: blueeconomy-ml-dev
max_workers: 0

provider:
  type: local
  head_ip: 127.0.0.1
  # On a real multi-node LAN, list worker_ips here; CPU-only by design.

auth:
  ssh_user: ubuntu

setup_commands:
  - pip install -r requirements.txt

head_node: {}
worker_nodes: {}

